# 安装器逐屏走查（2026-10-07 安装包修复批）：真 Windows 上把安装向导
# 一页页点过去并截图，落证「文案不截断 + 图标三处可见」。
#
# - 对象：滚动 nightly Release 里的 soar-setup-windows-x64.exe（手动触发
#   前先确认 Daily Build 已出含本次修复的安装器）。
# - 驱动方式：EnumWindows 按窗口类 TWizardForm 找向导主窗（Inno 是 stub
#   架构，向导归 %TEMP% 新进程，不能按 pid 找），EnumChildWindows 找
#   TNewButton 按 Finish/Install/Next 优先序 PostMessage(BM_CLICK) 翻页
#   ——不依赖键盘焦点，规避 SetForegroundWindow 的前台锁；页面序自适应。
# - 截图面：每页一张 before-*、Install 点击后补 installing 页 + 安装器
#   exe 图标、装后 soar.exe/soarw.exe 图标（ExtractAssociatedIcon）+
#   文件关联 DefaultIcon 注册表值。
# - DPI 口径（如实）：runner 桌面只有 100% 一档；125%/150% 依赖 Inno
#   6.3+ 的 per-monitor v2 自适应（WizardResizable 已开），真机三档
#   走查挂残余项，等有真实缩放显示器的环境补。
# - pwsh 四陷阱防护：GUI 子系统 exe 一律 Start-Process -PassThru；
#   原生命令逐个核 $LASTEXITCODE；失败路径 ::error:: + 截图后显式
#   exit 1（截图先落 artifact 再失败，诊断不丢）。
name: installer-walkthrough

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: installer-walkthrough-${{ github.ref }}
  cancel-in-progress: false

jobs:
  walkthrough:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Fetch nightly installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          # Daily Build 收尾是「删 tag 再重建」的清旧传新流程，重建后的
          # ref 在 API 边缘副本上有秒级不可见窗口（37614859185 实证
          # release not found）；带重试轮询等它稳定。
          $dl = $false
          for ($i = 1; $i -le 5; $i++) {
            gh release download nightly --repo "$env:GITHUB_REPOSITORY" `
              --pattern "soar-setup-windows-x64.exe" --output "$PWD\soar-setup.exe" --clobber
            if ($LASTEXITCODE -eq 0) { $dl = $true; break }
            Write-Host "::warning::download attempt $i failed (nightly tag 重建后副本窗口?), retrying in 30s"
            Start-Sleep -Seconds 30
          }
          if (-not $dl) {
            Write-Host "::error::gh release download failed after 5 attempts; nightly Release 缺 soar-setup-windows-x64.exe?"
            exit 1
          }
          Write-Host "installer: $((Get-Item "$PWD\soar-setup.exe").Length) bytes"

      - name: Walk wizard page by page with screenshots
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path "$PWD\shots" | Out-Null

          Add-Type -AssemblyName System.Drawing
          Add-Type @"
          using System;
          using System.Text;
          using System.Collections.Generic;
          using System.Runtime.InteropServices;
          public static class Win32 {
            public delegate bool EnumProc(IntPtr h, IntPtr lp);
            [DllImport("user32.dll")] public static extern bool EnumWindows(EnumProc cb, IntPtr lp);
            [DllImport("user32.dll")] public static extern bool EnumChildWindows(IntPtr h, EnumProc cb, IntPtr lp);
            [DllImport("user32.dll")] public static extern uint GetWindowThreadProcessId(IntPtr h, out uint pid);
            [DllImport("user32.dll")] public static extern bool IsWindowVisible(IntPtr h);
            [DllImport("user32.dll", CharSet=CharSet.Unicode)] public static extern int GetWindowText(IntPtr h, StringBuilder sb, int max);
            [DllImport("user32.dll", CharSet=CharSet.Unicode)] public static extern int GetClassName(IntPtr h, StringBuilder sb, int max);
            [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr h, out RECT r);
            [DllImport("user32.dll")] public static extern bool PostMessage(IntPtr h, uint msg, IntPtr wp, IntPtr lp);
            public struct RECT { public int L, T, R, B; }
            public static List<IntPtr> Found = new List<IntPtr>();
            // Inno 是 stub 架构：下载的 exe 自解压后由 %TEMP% 里的新进程
            // 持向导（37617497762 实证 pid 对不上）——按窗口类找，不按 pid。
            public static bool CollectWizard(IntPtr h, IntPtr lp) {
              if (!IsWindowVisible(h)) return true;
              StringBuilder cls = new StringBuilder(256); GetClassName(h, cls, 256);
              if (cls.ToString() == "TWizardForm") { Found.Add(h); }
              return true;
            }
            public static bool CollectChild(IntPtr h, IntPtr lp) { Found.Add(h); return true; }
            public static IntPtr FindWizard() {
              Found.Clear();
              EnumWindows(CollectWizard, IntPtr.Zero);
              IntPtr best = IntPtr.Zero; int bestLen = -1;
              foreach (IntPtr h in Found) {
                StringBuilder t = new StringBuilder(256); GetWindowText(h, t, 256);
                if (t.Length > bestLen) { bestLen = t.Length; best = h; }
              }
              return best;
            }
            // 诊断：全部顶层可见窗口（class/title/pid），向导找不到时全量
            // 打印——UAC 提示、解压窗、别的 pid 混淆一目了然。
            public static bool CollectAll(IntPtr h, IntPtr lp) {
              if (!IsWindowVisible(h)) return true;
              uint pid; GetWindowThreadProcessId(h, out pid);
              StringBuilder cls = new StringBuilder(256); GetClassName(h, cls, 256);
              StringBuilder t = new StringBuilder(256); GetWindowText(h, t, 256);
              System.Console.WriteLine("visible hwnd=" + h + " pid=" + pid + " class=" + cls + " title=" + t);
              return true;
            }
            public static void DumpAll() { EnumWindows(CollectAll, IntPtr.Zero); }
            // 诊断：向导全部子窗（class+text），按钮找不到时全量打印
            public static void DumpChildren(IntPtr wizard) {
              Found.Clear(); EnumChildWindows(wizard, CollectChild, IntPtr.Zero);
              foreach (IntPtr h in Found) {
                StringBuilder cls = new StringBuilder(256); GetClassName(h, cls, 256);
                StringBuilder t = new StringBuilder(256); GetWindowText(h, t, 256);
                System.Console.WriteLine("child hwnd=" + h + " class=" + cls + " text=" + t);
              }
            }
            // 向导按钮表：class TNewButton + 文本（& 助记符归一后匹配）
            public static List<IntPtr> FindButtons(IntPtr wizard, string[] names) {
              Found.Clear(); EnumChildWindows(wizard, CollectChild, IntPtr.Zero);
              List<IntPtr> hits = new List<IntPtr>();
              foreach (IntPtr h in Found) {
                StringBuilder cls = new StringBuilder(256); GetClassName(h, cls, 256);
                if (cls.ToString() != "TNewButton") continue;
                StringBuilder t = new StringBuilder(256); GetWindowText(h, t, 256);
                string norm = t.ToString().Replace("&", "").TrimEnd(' ', '>').Trim();
                foreach (string n in names) { if (string.Equals(norm, n, StringComparison.OrdinalIgnoreCase)) { hits.Add(h); } }
              }
              return hits;
            }
          }
          "@

          function Save-Shot([string]$Name, [IntPtr]$Hwnd) {
            [Win32+RECT]$r = New-Object 'Win32+RECT'
            [Win32]::GetWindowRect($Hwnd, [ref]$r) | Out-Null
            $w = $r.R - $r.L; $h = $r.B - $r.T
            if ($w -le 0 -or $h -le 0) { Write-Host "::warning::$Name window rect empty"; return }
            $bmp = New-Object System.Drawing.Bitmap($w, $h)
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($r.L, $r.T, 0, 0, (New-Object System.Drawing.Size($w, $h)))
            $g.Dispose()
            $bmp.Save("$PWD\shots\$Name.png", [System.Drawing.Imaging.ImageFormat]::Png)
            $bmp.Dispose()
            Write-Host "shot: $Name.png ($w x $h)"
          }

          function Dump-Buttons([IntPtr]$Wizard) {
            Write-Host "wizard children (all, for button hunt):"
            [Win32]::DumpChildren($Wizard)
          }

          # 先起 stub、再等向导窗（Inno 先解压到临时目录再出窗，60s 上限；
          # stub 先退不算失败，以向导窗为准——stub 与向导分属两个进程）。
          $inst = (Get-Item "$PWD\soar-setup.exe").FullName
          $proc = Start-Process -FilePath $inst -PassThru
          $wizard = [IntPtr]::Zero
          for ($i = 0; $i -lt 120; $i++) {
            $wizard = [Win32]::FindWizard()
            if ($wizard -ne [IntPtr]::Zero) { break }
            if ($proc.HasExited -and $i -gt 20) {
              $code = try { $proc.ExitCode } catch { 'unavailable' }
              Write-Host "::error::installer stub exited and no wizard window, stub code $code"
              [Win32]::DumpAll()
              exit 1
            }
            Start-Sleep -Milliseconds 500
          }
          if ($wizard -eq [IntPtr]::Zero) {
            Write-Host "::error::wizard window (TWizardForm) not found after 60s; visible top-level windows:"
            [Win32]::DumpAll()
            exit 1
          }

          # 通用翻页循环：截图当前页 → 点「优先 Finish > Install > Next」
          # 里存在的第一个按钮 → 等下一页稳定。页面序自适应（多页/少页
          # 都不崩），Install 点击后额外补一张安装进度页。
          $page = 0
          for ($i = 0; $i -lt 12; $i++) {
            $btn = [IntPtr]::Zero; $action = $null
            for ($w = 0; $w -lt 120; $w++) {
              foreach ($name in @("Finish", "Install", "Next")) {
                $hits = [Win32]::FindButtons($wizard, @($name))
                if ($hits.Count -gt 0) { $btn = $hits[0]; $action = $name; break }
              }
              if ($btn -ne [IntPtr]::Zero) { break }
              Start-Sleep -Milliseconds 500
            }
            if ($btn -eq [IntPtr]::Zero) {
              Write-Host "::error::no wizard button (Finish/Install/Next) after 60s at page $page"
              Save-Shot "ZZ-stuck-page$page" $wizard
              Dump-Buttons $wizard
              exit 1
            }
            $page++
            Save-Shot ("{0:d2}-before-{1}" -f $page, $action.ToLower()) $wizard
            [Win32]::PostMessage($btn, 0x00F5, [IntPtr]::Zero, [IntPtr]::Zero) | Out-Null  # BM_CLICK
            if ($action -eq "Finish") { break }
            Start-Sleep -Milliseconds 2500
            if ($action -eq "Install") {
              Save-Shot ("{0:d2}-installing" -f $page) $wizard
              Start-Sleep -Seconds 5
            }
          }
          if ($page -lt 3) {
            Write-Host "::error::walk ended after only $page pages, wizard flow unexpected"
            Dump-Buttons $wizard
            exit 1
          }

          if (-not $proc.WaitForExit(20000)) {
            Write-Host "::warning::installer still running after Finish, killing"
            Stop-Process -Id $proc.Id -Force
          }

          # 图标三处：安装器 exe / 应用 exe（ExtractAssociatedIcon 32px 位图）
          # / 文件关联 DefaultIcon（注册表值断言；同一份 assets/icons/soar.ico）
          foreach ($pair in @(@("icon-installer", $inst), @("icon-soar-exe", "C:\Program Files\Soar\soar.exe"), @("icon-soarw-exe", "C:\Program Files\Soar\soarw.exe"))) {
            $label = $pair[0]; $path = $pair[1]
            if (Test-Path $path) {
              $ico = [System.Drawing.Icon]::ExtractAssociatedIcon($path)
              $bmp2 = $ico.ToBitmap()
              $bmp2.Save("$PWD\shots\$label.png", [System.Drawing.Imaging.ImageFormat]::Png)
              $bmp2.Dispose(); $ico.Dispose()
              Write-Host "icon: $label.png from $path"
            } else {
              Write-Host "::error::expected file missing: $path"
              exit 1
            }
          }
          $deficon = (Get-ItemProperty 'HKLM:\SOFTWARE\Classes\Soar.Media\DefaultIcon' -ErrorAction Stop).'(default)'
          Write-Host "file-association DefaultIcon: $deficon"
          if ($deficon -notlike 'C:\Program Files\Soar\soar.ico*') {
            Write-Host "::error::DefaultIcon does not point at the installed soar.ico: $deficon"
            exit 1
          }
          Get-ChildItem "$PWD\shots" | ForEach-Object { Write-Host "artifact: $($_.Name) $($_.Length) bytes" }

      - name: Upload walkthrough screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: walkthrough-screenshots
          path: shots/
          if-no-files-found: error
