name: ios

on:
  workflow_dispatch:
  push:
    paths:
      - 'ios/**'

permissions:
  contents: read

jobs:
  kit:
    name: SoarKit (Swift Package)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # The package is pure Swift (no C++ core yet — see ios/README.md):
      # build the iOS slice and run the XCTest suite on macOS.
      - name: Build (iOS)
        working-directory: ios/SoarKit
        run: >
          xcodebuild build -scheme SoarKit
          -destination 'generic/platform=iOS'
          -quiet CODE_SIGNING_ALLOWED=NO

      - name: Test (macOS)
        working-directory: ios/SoarKit
        run: >
          xcodebuild test -scheme SoarKit
          -destination 'platform=macOS'
          -quiet CODE_SIGNING_ALLOWED=NO
