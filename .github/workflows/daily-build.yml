name: Daily Build

# 每日构建流水线：产物分发面有两个，都不是版本发布——
# ① Actions artifact（固定名 daily-build，全仓库只留一份最新）；
# ② 滚动 nightly Release（固定 tag: nightly，Pre-release，每次构建
#    清掉旧 assets 再传新的，Release 页任何人匿名可下）。
# 固定 tag nightly 是分发通道，不对应版本：版本发布禁令仍然有效
# （不打 v* 版本 tag、不发正式 Release）。
# upload-artifact@v4 产物不可变，同名直接传会报错，所以都走"先删后传"。
#
# 构建与测试步骤逐段对齐 ci.yml 的 build job（同样的 preset、同样的
# 依赖清单、测试媒体只在 Linux 生成——Windows/macOS 的媒体套件在无
# 夹具时自跳过，与 CI 口径一致），差异只有两处：构建类型用 Release
# （每日构建产物是给人运行的，Debug 二进制没有分发价值），以及最后
# 打包上传 artifact。

on:
  schedule:
    # UTC 00:40 = 北京时间 08:40；错开 unidict 每日构建的 21:17 UTC，
    # 也避开整点 runner 高峰
    - cron: '40 0 * * *'
  workflow_dispatch:

permissions:
  contents: write # collect job 维护滚动 nightly Release（建/清/传）需要
  actions: write  # collect job 删除历史 daily-build artifact 需要

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    # 180min（原 120）：2026-10-04 nightly 37233871129 的 Windows 腿摊上
    # 病态慢 runner——libtorrent 单 TU 30-76s（健康 ~10s），编到 [117/214]
    # 撞 120min 被 timeout 杀掉整跑；configure+vcpkg+build 的正常全程
    # ~22min，180 是慢 runner 下的三倍余量，仍能封住真挂死。
    timeout-minutes: 180

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x64
          # Linux arm64 on the free public ARM runner (no cost for public
          # repos); install.sh targets it, so the matrix must ship it.
          - os: ubuntu-24.04-arm
            name: linux-arm64
          - os: macos-latest
            name: macos-arm64
          - os: windows-latest
            name: windows-x64

    steps:
      - uses: actions/checkout@v4

      # Linux builds against system packages (apt) instead of vcpkg,
      # exactly like ci.yml: system FFmpeg dev headers let us compile the
      # FFmpeg backend for real.
      - name: Install system packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libsdl2-dev libfmt-dev doctest-dev libboost-dev ffmpeg \
            libavformat-dev libavcodec-dev libavutil-dev \
            libswresample-dev libswscale-dev libass-dev patchelf rpm

      # Synthetic media for the FFmpeg backend tests (same as ci.yml: the
      # script prints KEY=VALUE lines for $GITHUB_ENV).
      - name: Generate test media (Linux)
        if: runner.os == 'Linux'
        run: |
          bash scripts/generate_test_media.sh build-system/testmedia | tee env.txt
          cat env.txt >> "$GITHUB_ENV"

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew update && brew install ninja

      - name: Install FFmpeg dev packages (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg pkg-config

      - name: Install Ninja (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja -y

      # Windows: force the MSVC environment so CMake does not pick the
      # MinGW gcc from PATH while vcpkg's x64-windows triplet builds
      # dependencies with MSVC (mixed toolchains fail to link).
      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Clone vcpkg
        if: runner.os != 'Linux'
        shell: bash
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git vcpkg

      - name: Bootstrap vcpkg (Unix)
        if: runner.os == 'macOS'
        shell: bash
        run: ./vcpkg/bootstrap-vcpkg.sh -disableMetrics

      - name: Bootstrap vcpkg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\vcpkg\bootstrap-vcpkg.bat -disableMetrics

      # Release override: the presets pin Debug (what CI tests), the daily
      # product ships what people run. Command-line cache vars win.
      - name: Configure (Linux system packages)
        if: runner.os == 'Linux'
        run: cmake --preset linux-system -DCMAKE_BUILD_TYPE=Release

      - name: Configure (macOS/Windows)
        if: runner.os != 'Linux'
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
        shell: bash
        run: cmake --preset default -DCMAKE_BUILD_TYPE=Release

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: cmake --build --preset linux-system

      - name: Build (macOS/Windows)
        if: runner.os != 'Linux'
        run: cmake --build --preset default

      - name: Test (Linux)
        if: runner.os == 'Linux'
        env:
          SDL_AUDIODRIVER: dummy
        run: ctest --preset linux-system --output-on-failure

      # -V for the same reason ci.yml sets it: ctest buffers a suite's
      # output until it exits, and doctest's own buffer dies with the
      # process, so a suite killed at the timeout would otherwise leave
      # no trace of which test case it died in.
      - name: Test (macOS/Windows)
        if: runner.os != 'Linux'
        run: ctest --preset default -V --output-on-failure

      # 打包显式按 dumpbin 依赖闭包 staged（vcpkg applocal 只搬了它
      # 认得的一部分：2026-10 夜间包里 SDL2/fmt 在、openssl 对和
      # MSVC 运行库不在，用户解压即"缺少 DLL"）。闭包里 resolve 不
      # 到的名字会让本步直接失败，包不完整就不出包。
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -e
          mkdir -p stage
          bash scripts/stage-windows-dlls.sh build/soar.exe stage \
            build/vcpkg_installed/x64-windows/bin \
            build/vcpkg_installed/x64-windows/debug/bin
          # soarw.exe = GUI 子系统双胞胎（BUGS.md #2 黑框闪退修复）：
          # 双击启动无控制台黑框；依赖闭包与 soar.exe 相同（同链），无需
          # 二次闭包。soar.ico 随包（Inno 安装器 SetupIconFile 同源）。
          cp build/soarw.exe stage/
          cp assets/icons/soar.ico stage/
          cat > stage/PLATFORM-NOTES.txt <<'NOTES'
          Soar 每日构建 - Windows x64
          包含: soar.exe / soarw.exe 及其全部运行时 DLL（SDL2 / fmt /
          openssl 与 MSVC 运行库均随包捆绑，无需另装 Visual C++ 可运行库）

          用哪个 exe:
          - soarw.exe: 双击启动（GUI 程序，无控制台黑框）。启动失败会
            弹错误框，并写一行记录到 %TEMP%\soar-startup-failures.log
            （设置 SOAR_STARTUP_LOG 环境变量可改路径）。
          - soar.exe: 命令行版（终端里跑 CLI 用），无参运行打印 Usage
            后退出码 2 属预期。

          验证: soar.exe --version 打印版本（退出码 0）。

          说明:
          - 若 SmartScreen 拦截，点"更多信息 -> 仍要运行"（每日构建
            未做代码签名）。
          - 当前 Windows 构建未启用 FFmpeg 后端，--backend=ffmpeg 会
            如实报告不可用；媒体播放链路待 Windows 侧 FFmpeg 接通后
            开放。
          NOTES
          powershell -NoProfile -Command "Compress-Archive -Path stage/* -DestinationPath soar-windows-x64.zip -Force"

      # setup.exe 安装器（2026-10 包格式补全，todo.md ②）：Inno Setup，
      # falcon/memex 同形态（装目录/开始菜单/桌面图标/卸载器）。快捷方式
      # 指向 soarw.exe（无黑框）。runner 预装 Inno Setup 6.x（falcon 实证
      # 6.3+ 即可用，本 iss 只用标准指令）。pwsh 三道锁同 Verify 步。
      - name: Build installer (Windows, Inno Setup)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          $iscc = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            Write-Host "::error::ISCC.exe not found (expected the preinstalled Inno Setup 6 on windows-latest)"
            exit 1
          }
          $version = (Select-String -Path CMakeLists.txt -Pattern 'VERSION (\d+\.\d+\.\d+)' |
            Select-Object -First 1).Matches[0].Groups[1].Value
          & $iscc "/DAppVersion=$version" "/DStageDir=$PWD\stage" "/O$PWD" 'packaging/windows/soar.iss'
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::ISCC failed with exit $LASTEXITCODE"
            exit 1
          }
          if (-not (Test-Path 'soar-setup-windows-x64.exe')) {
            Write-Host "::error::installer output soar-setup-windows-x64.exe missing"
            exit 1
          }
          Write-Host "installer: soar-setup-windows-x64.exe, $((Get-Item 'soar-setup-windows-x64.exe').Length) bytes"
          exit 0

      # 产物级防回归：把 zip 解压到干净目录、PATH 只留 System32 再实
      # 跑——runner 自带的运行库会把漏捆掩盖掉，收窄 PATH 后缺一个
      # DLL 立刻现形（这正是用户机器上的死法）。
      #
      # 退出码三道锁（run 37137950125 教训：两个断言全过、无任何错误
      # 输出，步骤仍退 1）。`pwsh -command` 的收尾语义会把执行期的
      # ErrorRecord/$? 折算成 1；本地 7.4/7.5/7.6 复现实证：原生调用带
      # 2>&1 且退出码非 0 就会生成静默记录（被管道吞掉看不见）。因此：
      #   1) 关掉原生非零退出生成记录的偏好（防 profile 打开）；
      #   2) 原生调用一律不进 2>&1，记录连源头都不留；
      #   3) 通过路径显式 exit 0，成败只由断言裁决，不交给 $?。
      - name: Verify package (Windows, clean dir)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          Expand-Archive soar-windows-x64.zip -DestinationPath smoke-win -Force
          $env:PATH = "$env:SystemRoot\System32"
          $out = (& .\smoke-win\soar.exe --version | Out-String)
          $code = $LASTEXITCODE
          Write-Host "version exit=$code output=$out"
          # 无参用法约定打印 Usage、退出 2（控制台入口：无源→usage 退
          # 出；GUI 入口的空主界面见 ③）。文本原样漏进日志留证；两个
          # 流都不经 2>&1 重定向。
          & .\smoke-win\soar.exe
          $ucode = $LASTEXITCODE
          Write-Host "usage exit=$ucode"
          if ($code -ne 0 -or $out -notmatch 'soar' -or $out -match '(?i)\.dll') {
            Write-Host "::error::soar.exe --version failed from a clean dir (missing DLL or bad exit)"
            exit 1
          }
          if ($ucode -ne 2) {
            Write-Host "::error::soar.exe without args should exit 2, got $ucode"
            exit 1
          }

          # —— soarw.exe（GUI 子系统双胞胎，BUGS.md #2 防回归）——
          # ① PE 子系统字节校验：soarw 必须 =2（GUI，双击无控制台黑框），
          #    soar 必须 =3（控制台——CLI 行为的载体，别被误标）。
          foreach ($pair in @(@('soarw', 2), @('soar', 3))) {
            $pe = [IO.File]::ReadAllBytes("$PWD\smoke-win\$($pair[0]).exe")
            $off = [BitConverter]::ToInt32($pe, 0x3C)
            $sub = [BitConverter]::ToUInt16($pe, $off + 92)
            Write-Host "$($pair[0]).exe PE subsystem = $sub (expect $($pair[1]))"
            if ($sub -ne $pair[1]) {
              Write-Host "::error::$($pair[0]).exe PE subsystem is $sub, expected $($pair[1])"
              exit 1
            }
          }
          # ② GUI 子系统 exe 的 --version 经句柄重定向捕获（stdout 句柄
          #    是文件时不弹对话框——CI 安全路径的实证）。
          $env:SOAR_NO_DIALOG = '1'
          $vf = Join-Path $env:RUNNER_TEMP 'soarw-ver.txt'
          $p = Start-Process .\smoke-win\soarw.exe -ArgumentList '--version' -Wait -PassThru `
            -RedirectStandardOutput $vf
          $t = Get-Content $vf -Raw
          if ($p.ExitCode -ne 0 -or $t -notmatch 'soar') {
            Write-Host "::error::soarw.exe --version failed (exit=$($p.ExitCode), output=$t)"
            exit 1
          }
          Write-Host "soarw version: $($t.Trim())"
          # ③ 无参 = 空主界面（BUGS.md #3：双击是启动不是命令行，不再
          #    usage 退出 2——控制台 soar.exe 的无参 usage 断言在上面保持
          #    不变）。GUI 子系统 exe 直接 & 调用 pwsh 不等待、$LASTEXITCODE
          #    恒空（ci.yml run 37171717828 实证），且修复后无参不再退出
          #    ——必须 -PassThru 看 8 秒存活；真退了（含 exit 2 的 usage
          #    回归）都不行，唯一豁免与 ④ 同款：exit 1 + SDL_ 日志。
          $eo = Join-Path $env:RUNNER_TEMP 'soarw-empty-out.txt'
          $ee = Join-Path $env:RUNNER_TEMP 'soarw-empty-err.txt'
          $p = Start-Process .\smoke-win\soarw.exe -PassThru `
            -RedirectStandardOutput $eo -RedirectStandardError $ee
          Start-Sleep -Seconds 8
          if (-not $p.HasExited) {
            Write-Host "soarw empty start (no args) still alive after 8s - OK (BUGS.md #3)"
            $p.Kill()
          } else {
            $err = Get-Content $ee -Raw
            Write-Host "soarw exited early (code $($p.ExitCode)): $err"
            if ($p.ExitCode -ne 1 -or $err -notmatch 'SDL_') {
              Write-Host "::error::soarw with no args must open the empty player window (exit 2 = usage regression, BUGS.md #3)"
              exit 1
            }
            Write-Host "degraded to the documented clean SDL failure path (renderer-less runner)"
          }
          # ④ 窗口站住（BUGS.md #2 验收「窗口能站住」）：null 后端 + 默认
          #    视频驱动起一个真窗口，8 秒后进程必须还活着。runner 无
          #    GPU 时渲染器可能起不来——只接受「站住」或「带日志的干净
          #    渲染器失败」两种结果，闪退/崩溃都不行。
          $so = Join-Path $env:RUNNER_TEMP 'soarw-alive-out.txt'
          $se = Join-Path $env:RUNNER_TEMP 'soarw-alive-err.txt'
          $p = Start-Process .\smoke-win\soarw.exe -ArgumentList '--backend=null', 'smoke-win\PLATFORM-NOTES.txt' -PassThru `
            -RedirectStandardOutput $so -RedirectStandardError $se
          Start-Sleep -Seconds 8
          if (-not $p.HasExited) {
            Write-Host "soarw windowed run still alive after 8s (null backend) - OK"
            $p.Kill()
          } else {
            $err = Get-Content $se -Raw
            Write-Host "soarw exited early (code $($p.ExitCode)): $err"
            if ($p.ExitCode -ne 1 -or $err -notmatch 'SDL_') {
              Write-Host "::error::soarw windowed run neither stayed up nor failed cleanly at an SDL step"
              exit 1
            }
            Write-Host "degraded to the documented clean SDL failure path (renderer-less runner)"
          }
          Remove-Item Env:SOAR_NO_DIALOG

          # —— 安装器真装走查（todo.md ②）：静默装 → 装后实跑 → 快捷方式
          #    断言 → 静默卸载。装完就能跑 = 安装器价值所在。 ——
          $setup = "$PWD\soar-setup-windows-x64.exe"
          if (-not (Test-Path $setup)) {
            Write-Host "::error::installer not found: $setup"
            exit 1
          }
          $p = Start-Process $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          if ($p.ExitCode -ne 0) {
            Write-Host "::error::installer exited with $($p.ExitCode)"
            exit 1
          }
          $app = Join-Path $env:ProgramFiles 'Soar\soarw.exe'
          if (-not (Test-Path $app)) {
            Write-Host "::error::not installed: $app"
            exit 1
          }
          $vf2 = Join-Path $env:RUNNER_TEMP 'installed-ver.txt'
          $p2 = Start-Process $app -ArgumentList '--version' -Wait -PassThru -RedirectStandardOutput $vf2
          $t2 = Get-Content $vf2 -Raw
          if ($p2.ExitCode -ne 0 -or $t2 -notmatch 'soar') {
            Write-Host "::error::installed soarw --version failed (exit=$($p2.ExitCode), output=$t2)"
            exit 1
          }
          $lnk = Join-Path $env:ProgramData 'Microsoft\Windows\Start Menu\Programs\Soar\Soar.lnk'
          if (-not (Test-Path $lnk)) {
            Write-Host "::error::start menu shortcut missing: $lnk"
            exit 1
          }
          Write-Host "installed + verified: $($t2.Trim())"
          # 资源管理器「打开方式 → Soar」注册（BUGS.md #3 收口 ③）：
          # Soar.Media ProgId 打开命令必须指向 soarw.exe（双击关联媒体
          # 文件全链路的注册面），.mp4 的 OpenWithProgids 必须有 Soar.Media
          # 候选——只作候选不抢默认。PrivilegesRequired=admin → HKA 落
          # HKLM。
          $cls = 'HKLM:\Software\Classes'
          $cv = $null
          $ck = Get-Item "$cls\Soar.Media\shell\open\command" -ErrorAction SilentlyContinue
          if ($ck) { $cv = $ck.GetValue(''); $ck.Close() }
          if (-not $cv -or $cv -notmatch 'soarw\.exe') {
            Write-Host "::error::Soar.Media open command missing or wrong: $cv"
            exit 1
          }
          $has = $false
          $mk = Get-Item "$cls\.mp4\OpenWithProgids" -ErrorAction SilentlyContinue
          if ($mk) { $has = $mk.GetValueNames() -contains 'Soar.Media'; $mk.Close() }
          if (-not $has) {
            Write-Host "::error::.mp4 OpenWithProgids has no Soar.Media candidate"
            exit 1
          }
          Write-Host "association registered: $cv"
          # Inno 卸载器是两阶段自删除：unins000.exe 先把自己拷进 %TEMP%
          # 再起副本执行真正卸载，首进程立即退出且退出码非 0（run
          # 37176187658 实证 exit 2，卸载本身成功）——成败只看卸载痕迹
          # 是否消失，轮询等待副本收尾，不盯首进程退出码。
          Start-Process (Join-Path $env:ProgramFiles 'Soar\unins000.exe') `
            -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES'
          $gone = $false
          for ($i = 0; $i -lt 30; $i++) {
            Start-Sleep -Seconds 2
            if (-not (Test-Path (Join-Path $env:ProgramFiles 'Soar')) `
                -and -not (Test-Path $lnk) `
                -and -not (Test-Path "$cls\Soar.Media")) {
              $gone = $true
              break
            }
          }
          if (-not $gone) {
            Write-Host "::error::uninstall incomplete after 60s (install dir and/or start menu shortcut still present)"
            exit 1
          }
          if (Test-Path $app) {
            Write-Host "::error::uninstall left $app behind"
            exit 1
          }
          # 关联清理也必须收干净（BUGS.md #3：装是候选、卸是无痕）
          $left = $false
          $mk2 = Get-Item "$cls\.mp4\OpenWithProgids" -ErrorAction SilentlyContinue
          if ($mk2) { $left = $mk2.GetValueNames() -contains 'Soar.Media'; $mk2.Close() }
          if ($left -or (Test-Path "$cls\Soar.Media")) {
            Write-Host "::error::uninstall left association registry behind"
            exit 1
          }
          Write-Host "association cleaned up on uninstall"
          Write-Host "verify passed: package runs from an empty dir with PATH=System32 only; installer round-trip OK"
          exit 0

      # macOS 打包同样按闭包（与 Windows/Linux 同哲学）：SDL2 与
      # vcpkg 管理的依赖（含 openssl）静态链进二进制，但 macOS 的
      # FFmpeg 经 pkg-config 来自 brew（动态）、fontconfig 亦然——
      # 不捆绑的话产物只能在装了同版本 brew 的机器上启动（2026-10
      # nightly 实测：libav*×5 + openssl×2 + fontconfig×1 全是
      # /opt/homebrew 绝对路径引用）。闭包 resolve 不到的名字直接
      # 失败，不出不完整的包。
      - name: Package (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -e
          bash scripts/stage-macos-dylibs.sh build/soar stage
          cat > stage/PLATFORM-NOTES.txt <<'NOTES'
          Soar 每日构建 - macOS (Apple Silicon)
          包含: soar + lib/（FFmpeg 等动态库随包捆绑；SDL2 静态链接
          进二进制。soar 与 lib/ 必须保持在同一目录）

          验证: ./soar --version 打印版本（退出码 0）；
          不带参数运行应打印 Usage（退出码 2 属预期）。
          首次运行如被 Gatekeeper 拦截: xattr -cr soar

          说明: 未签名（每日构建不做代码签名）。
          NOTES
          # 必须先进 stage：zip . 在 workspace 根会把整个 build/ 打进包
          cd stage
          zip -qr ../soar-macos-arm64.zip .

      # 产物级防回归（与 Windows/Linux 同哲学）：解压后断言 bundle
      # 内任何二进制不再引用构建机 brew 路径，并实跑 --version 与
      # 无参 Usage。runner 上 brew 在场会掩盖漏捆，otool 断言才是
      # 硬门。
      - name: Verify package (macOS, no brew refs)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -e
          rm -rf smoke-mac && unzip -q soar-macos-arm64.zip -d smoke-mac
          bad=$(otool -L smoke-mac/soar smoke-mac/lib/*.dylib 2>/dev/null \
            | grep -E '/opt/homebrew|/usr/local/' || true)
          if [ -n "$bad" ]; then
            echo "::error::brew path refs remain in the package:"
            echo "$bad"
            exit 1
          fi
          ./smoke-mac/soar --version
          set +e; ./smoke-mac/soar > /dev/null 2>&1; code=$?; set -e
          if [ "$code" != 2 ]; then
            echo "::error::soar without args should exit 2, got $code"
            exit 1
          fi

      # Linux 包运行时自包含：ldd 全闭包里除「glibc 家族 +
      # libstdc++/libgcc + GL/Mesa」外全部拷进 lib/ 随包分发，再用
      # patchelf 给每个捆绑库设 RUNPATH=$ORIGIN、主程序设
      # $ORIGIN/lib。RUNPATH 不传递——每个库要自己找邻居，只给
      # 主程序设是不够的（Soname 换代时二进制在新发行版起不来，
      # 2026-10 的 libfmt.so.9→.10 就是这一课）。三类排除是刻意的:
      # glibc 家族与 libstdc++/libgcc 靠版本符号与系统锁定，混搭
      # 反而危险；GL/Mesa 的驱动侧接口（libGL/libEGL/libgallium 等，
      # SDL2 运行期 dlopen 而非链接）跨版本无 ABI 稳定承诺，必须整套
      # 随目标系统走（桌面发行版都自带）。注意 libgbm 例外地要捆：
      # 它是 SDL2 的链接期依赖而非 dlopen 目标——见下面 EXCL 旁注。
      # 一部覆盖两个架构
      # (linux-x64 / linux-arm64)：zip 名带 matrix.name。
      - name: Package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -e
          mkdir -p stage/lib
          cp build-system/soar stage/
          ldd build-system/soar | awk '$3 ~ /^\// {print $3}' | sort -u > closure.txt
          # 注意 libgbm 不在排除里：它是 SDL2 的真实 DT_NEEDED，裸
          # 容器（无 mesa）缺它直接起不来——2026-10-02 裸容器抓到过
          # 这一次（runner 系统库在场会把漏捆掩盖掉，只有裸容器现形）。
          EXCL='/(ld-linux|libc\.so\.|libm\.so\.|libpthread|libdl\.so|librt\.so|libresolv|libnsl\.so|libutil\.so|libanl|libBrokenLocale|libmvec|libnss_|libgcc_s|libstdc\+\+|libGL\.so|libGLX|libGLdispatch|libEGL|libgallium|libOSMesa)'
          grep -vE "$EXCL" closure.txt > bundle.txt
          while read -r so; do
            cp -L "$so" "stage/lib/$(basename "$so")"
            patchelf --set-rpath '$ORIGIN' "stage/lib/$(basename "$so")"
          done < bundle.txt
          patchelf --set-rpath '$ORIGIN/lib' stage/soar
          # 自检：runner 系统库还在场，所以 not found 检查才是硬门——
          # 缺一个捆绑库它立刻现形（能跑不能说明捆绑齐，ldd 能）。
          if ldd stage/soar | grep -qi 'not found'; then
            ldd stage/soar | grep -i 'not found'
            exit 1
          fi
          stage/soar --version > /dev/null
          echo "bundled $(wc -l < bundle.txt) libs into lib/"
          cat > stage/PLATFORM-NOTES.txt <<NOTES
          Soar 每日构建 - Linux (${{ matrix.name }})
          包含: soar + lib/（运行时库随包捆绑: SDL2 / FFmpeg / libass /
          fmt 等全部自带，无需安装；GL/Mesa 留给系统，桌面发行版都
          自带。soar 与 lib/ 必须保持在同一目录）

          系统要求（如实，捆绑替代不了 libc 本身）:
          要求 glibc >= 2.38 且 libstdc++ >= GLIBCXX_3.4.32
          （约 Ubuntu 24.04+ / Debian 13+ / Fedora 39+ / Arch 滚动）。
          更老的系统（如 Ubuntu 22.04 / Debian 12）装不上这些版本
          符号，二进制起不来——这是编译器与 libc 版本决定的，
          随包捆绑解决不了。

          验证: 终端运行 ./soar --version 打印版本（退出码 0）；
          或 ./soar 不带参数，应打印 Usage（退出码 2 属预期）。
          NOTES
          # 必须先进 stage：zip . 在 workspace 根会把整个 build/ 打进包
          cd stage
          zip -qr ../soar-${{ matrix.name }}.zip .

      # deb / rpm 安装包（2026-10 包格式补全，todo.md ①）：从上面同源
      # zip 二次打包——单一事实源，包内布局与 zip 解包即用一致（
      # /opt/soar + /usr/bin/soar + .desktop + hicolor 图标）。自包含口径
      # 不声明 Depends，目标机 glibc/libstdc++ 底线与 zip 相同。
      - name: Package (Linux deb/rpm)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -e
          VERSION=$(sed -n 's/^  VERSION \([0-9.]*\)$/\1/p' CMakeLists.txt | head -1)
          ARCH=x64; case "${{ matrix.name }}" in linux-arm64) ARCH=arm64;; esac
          # 输出到 workspace 根：upload 步的 pattern 在根上匹配
          bash scripts/package-linux-pkg.sh deb "$ARCH" "soar-${{ matrix.name }}.zip" . "$VERSION"
          bash scripts/package-linux-pkg.sh rpm "$ARCH" "soar-${{ matrix.name }}.zip" . "$VERSION"
          ls -la soar-*.deb soar-*.rpm

      # 安装包真装走查（memex 同款口径）：deb 装上 → 入口实跑 → 卸载；
      # rpm 同一载荷再走一遍。安装包的价值在「装完就能跑」，走查必须
      # 是真安装而不是解包检查。
      - name: Verify packages (Linux dpkg/rpm install walk)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -e
          sudo dpkg -i soar-${{ matrix.name }}.deb
          /usr/bin/soar --version
          set +e; /usr/bin/soar > /dev/null 2>&1; code=$?; set -e
          if [ "$code" != "2" ]; then
            echo "::error::installed soar without args should exit 2, got $code"
            exit 1
          fi
          sudo dpkg -r soar
          sudo rpm -ivh --replacepkgs soar-${{ matrix.name }}.rpm
          /usr/bin/soar --version
          sudo rpm -e soar
          echo "deb/rpm install walk passed (${{ matrix.name }})"

      - name: Upload platform package
        uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.name }}
          # deb/rpm 仅 Linux 腿、setup.exe 仅 Windows 腿产出——同一
          # pattern 列表跨平台复用，各腿只上传自己有的
          path: |
            soar-*.zip
            soar-*.deb
            soar-*.rpm
            soar-setup-*.exe
          retention-days: 1
          if-no-files-found: error

  # 裸容器验证：镜像里除 glibc/libstdc++ 外没有任何运行时库（连
  # unzip/python3 都没有），包必须自给自足。两个镜像各跑一遍——
  # ubuntu:24.04 是构建同代基线；ubuntu:latest（≥ 26.04，FFmpeg/fmt
  # 的 SONAME 已换代）正是当初 --version 都起不来的跨代场景，
  # 捆绑库就是为它做的。runner 自己的系统库会把「漏捆」掩盖掉
  # （缺的库系统里有），裸容器不会。zip 在 runner 侧解包（裸容器
  # 没有解压工具），容器只负责运行；$ORIGIN 相对二进制定位，挂在
  # /w 下照样解析到 /w/x/lib。
  verify-linux:
    name: Verify (${{ matrix.name }}) in bare containers
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x64
          # arm64 包在 arm runner 上用原生 arm64 镜像做同样的验证
          - os: ubuntu-24.04-arm
            name: linux-arm64
    steps:
      - name: Download platform package
        uses: actions/download-artifact@v4
        with:
          name: pkg-${{ matrix.name }}
          path: .

      - name: Unzip (runner side; bare container has no unzip)
        run: |
          set -e
          mkdir x
          unzip -q soar-*.zip -d x

      - name: Smoke in bare containers (24.04 same-gen + latest cross-gen)
        run: |
          set -e
          cat > x/bare-verify.sh <<'EOF'
          set -e
          /w/x/soar --version
          set +e
          /w/x/soar > /dev/null 2>&1
          code=$?
          set -e
          if [ "$code" != "2" ]; then
            echo "Usage 退出码异常: $code（预期 2）"
            exit 1
          fi
          if ldd /w/x/soar | grep -qi 'not found'; then
            ldd /w/x/soar | grep -i 'not found'
            exit 1
          fi
          EOF
          for img in ubuntu:24.04 ubuntu:latest; do
            echo "== $img =="
            docker pull -q "$img" > /dev/null
            docker run --rm -v "$PWD:/w:ro" "$img" bash /w/x/bare-verify.sh
            echo "== $img OK =="
          done

  # 汇总：三平台 zip + BUILD_INFO + VERIFY 打成一个固定名 artifact。
  # 上传前先删历史同名 daily-build——v4 产物不可变，不删必报错；
  # 删了再传即"全仓库只存在一份最新每日构建"。
  collect:
    name: Collect daily-build
    needs: [build, verify-linux]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download platform packages
        uses: actions/download-artifact@v4
        with:
          pattern: pkg-*
          merge-multiple: true
          path: pkgs

      - name: Remove previous daily-build artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ids=$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name == "daily-build") | .id')
          if [ -n "$ids" ]; then
            echo "$ids" | while read -r id; do
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/$id" \
                && echo "deleted artifact $id"
            done
          else
            echo "no previous daily-build artifact"
          fi

      - name: Build info and verify guide
        run: |
          set -e
          VERSION=$(sed -n 's/^  VERSION \([0-9.]*\)$/\1/p' CMakeLists.txt | head -1)
          UTC_TIME=$(date -u +'%Y-%m-%d %H:%M UTC')
          BJ_TIME=$(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M 北京时间')
          BUILD_DATE=$(date -u +'%Y%m%d')
          {
            echo "Soar 每日构建 (daily-build)"
            echo "更新时间: ${UTC_TIME} / ${BJ_TIME}"
            echo "Commit:   ${GITHUB_SHA}"
            echo "短 sha:   ${GITHUB_SHA::8}"
            echo "版本:     ${VERSION}（CMake project VERSION，非 Release 版本号）"
            echo "触发方式: ${{ github.event_name }}"
            echo ""
            echo "这是 CI 构建产物分发，同时发布到滚动 nightly Release（固定 tag nightly，非版本发布）。"
            echo ""
            echo "平台产物:"
            echo "  soar-windows-x64.zip       Windows x64 便携: soar.exe / soarw.exe + 依赖 DLL"
            echo "  soar-setup-windows-x64.exe Windows x64 安装器（Inno Setup: 装目录/开始菜单/桌面图标/卸载器，快捷方式指向 soarw.exe）"
            echo "  soar-macos-arm64.zip       macOS Apple Silicon: soar + lib/（FFmpeg 等动态库已捆绑，SDL2 静态链接）"
            echo "  soar-linux-x64.zip         Linux x64 便携: soar + lib/（运行时已捆绑，仅依赖系统 glibc/libstdc++，见包内说明）"
            echo "  soar-linux-x64.deb / .rpm  Linux x64 安装包（/opt/soar + /usr/bin/soar + 菜单项/图标）"
            echo "  soar-linux-arm64.zip       Linux arm64 便携: 同上 arm64 构建"
            echo "  soar-linux-arm64.deb / .rpm Linux arm64 安装包"
          } > BUILD_INFO.txt
          cat > VERIFY.md <<'VERIFY'
          # 最简验证
          每个平台 zip 内附 PLATFORM-NOTES.txt；Release 附
          SHA256SUMS.txt 覆盖全部资产（`sha256sum -c SHA256SUMS.txt`）。

          ## 通用冒烟（各平台一致）
          1. `soar --version`（Windows: `soar.exe --version`）应打印
             `soar <版本>` 并以退出码 0 结束。
          2. 不带参数运行：应打印 Usage 并以退出码 2 结束——这就是
             无媒体源时的预期自证行为。

          ## Windows
          - 便携: 解压 soar-windows-x64.zip（exe 与 DLL 须同目录，
             运行时 DLL 已全部随包，无需另装 VC 可运行库）。双击用
             soarw.exe（GUI 版，无控制台黑框；启动失败会弹错误框并
             写 %TEMP%\soar-startup-failures.log），终端跑 CLI 用
             soar.exe。
          - 安装器: 双击 soar-setup-windows-x64.exe（装目录/开始
             菜单/桌面快捷方式/卸载器；SmartScreen 拦截时"仍要运行"）。
          - 当前 Windows 构建未启用 FFmpeg 后端，`--backend=ffmpeg`
             会如实报告不可用——媒体播放链路待 Windows 侧 FFmpeg
             接通后开放。

          ## macOS (Apple Silicon)
          1. 解压 soar-macos-arm64.zip（soar 与 lib/ 须保持同目录；
             FFmpeg 等动态库已随包捆绑，SDL2 静态链接进二进制）
          2. `xattr -cr . && ./soar --version`（未签名，先清整个
             解压目录的隔离属性——lib/ 里的库也要清）

          ## Linux (x64 / arm64)
          - 便携: 解压 soar-linux-<arch>.zip，运行时库已随包捆绑
            （lib/），无需安装 SDL2/FFmpeg；但要求 glibc >= 2.38 且
            libstdc++ >= GLIBCXX_3.4.32（Ubuntu 24.04+ / Debian 13+ /
            Fedora 39+ / Arch 滚动；更老的系统起不来，见包内
            PLATFORM-NOTES.txt），`chmod +x soar && ./soar --version`。
          - 安装包: deb 系 `sudo dpkg -i soar-linux-<arch>.deb`、
            rpm 系 `sudo rpm -ivh soar-linux-<arch>.rpm`，装完
            `soar --version`（菜单项在 AudioVideo 分类）。重装/升级 =
            再装一次（包管理器幂等）。
          VERIFY
          # 打总包：全部平台产物平铺 + 顶层说明（artifact 解开即见）
          mv pkgs/soar-*.zip pkgs/soar-*.deb pkgs/soar-*.rpm pkgs/soar-setup-*.exe .
          # SHA256 清单覆盖全部产物（自身与说明文件除外）
          find . -maxdepth 1 -type f \
            ! -name 'SHA256SUMS.txt' ! -name 'VERIFY.md' ! -name 'BUILD_INFO.txt' \
            -printf '%f\n' | sort | xargs sha256sum > SHA256SUMS.txt
          zip -q "soar-daily-${BUILD_DATE}-${GITHUB_SHA::8}.zip" \
            soar-windows-x64.zip soar-setup-windows-x64.exe soar-macos-arm64.zip \
            soar-linux-x64.zip soar-linux-x64.deb soar-linux-x64.rpm \
            soar-linux-arm64.zip soar-linux-arm64.deb soar-linux-arm64.rpm \
            BUILD_INFO.txt VERIFY.md SHA256SUMS.txt
          # 供后续步骤引用的输出
          echo "daily_zip=soar-daily-${BUILD_DATE}-${GITHUB_SHA::8}.zip" >> "$GITHUB_ENV"
          echo "utc_time=${UTC_TIME}" >> "$GITHUB_ENV"
          echo "bj_time=${BJ_TIME}" >> "$GITHUB_ENV"

      - name: Upload daily-build
        uses: actions/upload-artifact@v4
        with:
          name: daily-build
          path: ${{ env.daily_zip }}
          retention-days: 14
          if-no-files-found: error

      # 滚动 nightly Release：固定 tag，每次构建把 target 重新指到本次
      # commit、清掉全部旧 assets 再传新的（全仓库只留最新一份，重跑幂等）。
      # Release 说明对齐 falcon nightly 的形态：时间 / commit / 下载表 /
      # 注意事项 / 验证方法。匿名可下（公开仓库 Release assets 无需登录）。
      - name: Publish nightly Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          if gh release view nightly > /dev/null 2>&1; then
            gh release edit nightly --title "Nightly Build (nightly)" --prerelease
            # gh release edit 不支持 --target：移动固定 tag 指向本次 commit
            # （PATCH 失败兜底删重建，秒级窗口内完成）
            if ! gh api -X PATCH \
                "repos/${GITHUB_REPOSITORY}/git/refs/tags/nightly" \
                -f sha="$GITHUB_SHA" -F force=true > /dev/null 2>&1; then
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/nightly" \
                || true
              gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" \
                -f ref=refs/tags/nightly -f sha="$GITHUB_SHA"
            fi
          else
            gh release create nightly --target "$GITHUB_SHA" \
              --title "Nightly Build (nightly)" --prerelease \
              --notes "每日构建发布中…"
          fi
          for name in $(gh release view nightly --json assets --jq '.assets[].name'); do
            gh release delete-asset nightly "$name" -y && echo "deleted asset $name"
          done
          cat > release-notes.md <<NOTES
          # Soar Nightly Build

          \`nightly-${BUILD_DATE}-${GITHUB_SHA::8}\` · 更新时间 ${utc_time} / ${bj_time}

          这是每日构建（自动构建、未签名），可能包含未完成的实验性功能，
          稳定性不作保证；追求稳定请等正式版本。

          ## 下载

          | 平台 | 文件 | 说明 |
          |---|---|---|
          | Windows 10/11 x64 | \`soar-setup-windows-x64.exe\` | 安装器（装目录/开始菜单/桌面图标/卸载器；启动 soarw.exe，无控制台黑框） |
          | Windows 10/11 x64 | \`soar-windows-x64.zip\` | 便携: soar.exe / soarw.exe + 依赖 DLL，解压即用 |
          | macOS Apple Silicon | \`soar-macos-arm64.zip\` | soar + 捆绑动态库 lib/（SDL2 静态链接），\`xattr -cr .\` 后运行，解压即用 |
          | Linux x64 | \`soar-linux-x64.deb\` / \`.rpm\` | 安装包（/opt/soar + /usr/bin/soar + 菜单项/图标；运行时自包含） |
          | Linux x64 | \`soar-linux-x64.zip\` | 便携: soar + 捆绑运行时 lib/，免装 SDL2/FFmpeg，仅依赖系统 glibc/libstdc++ |
          | Linux arm64 | \`soar-linux-arm64.deb\` / \`.rpm\` / \`.zip\` | 同上（arm64 原生构建） |
          | 全部 + 校验 | \`${daily_zip}\` | 上列全部产物 + SHA256SUMS.txt + BUILD_INFO.txt + VERIFY.md |

          一键安装（Linux/macOS）: \`curl -fsSL https://raw.githubusercontent.com/cuihairu/soar/main/install.sh | sh\`
          一键安装（Windows PowerShell）: \`irm https://raw.githubusercontent.com/cuihairu/soar/main/install.ps1 | iex\`

          ## 验证

          先 \`sha256sum -c SHA256SUMS.txt\`（校验清单随 Release 发布）。
          \`soar --version\` 打印版本即安装成功；命令行运行不带参数应打印
          Usage 并以退出码 2 结束——无媒体源时的预期自证行为。Windows
          双击请用 soarw.exe（GUI 版；启动失败弹错误框并写
          %TEMP%\soar-startup-failures.log）。详细步骤见包内 VERIFY.md
          与各平台 PLATFORM-NOTES.txt。

          Commit: ${GITHUB_SHA}
          NOTES
          gh release edit nightly --notes-file release-notes.md
          gh release upload nightly "$daily_zip" \
            soar-windows-x64.zip soar-setup-windows-x64.exe soar-macos-arm64.zip \
            soar-linux-x64.zip soar-linux-x64.deb soar-linux-x64.rpm \
            soar-linux-arm64.zip soar-linux-arm64.deb soar-linux-arm64.rpm \
            BUILD_INFO.txt VERIFY.md SHA256SUMS.txt --clobber
          echo "nightly release updated: ${daily_zip}"

      - name: Run summary
        run: |
          {
            echo "## 每日构建产物"
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| 更新时间 | ${utc_time} / ${bj_time} |"
            echo "| Commit | \`${GITHUB_SHA}\` |"
            echo "| 产物 | artifact **daily-build**（唯一最新版，历史已清理）+ Release **Nightly Build (nightly)** 同步发布 |"
            echo "| 平台 | windows-x64（zip+setup.exe 安装器）/ macos-arm64（soar+lib/ 捆绑）/ linux-x64·arm64（zip + deb/rpm 安装包） |"
            echo ""
            echo "下载: 本 run 页面底部 Artifacts 区 \`daily-build\`，或 <https://github.com/${GITHUB_REPOSITORY}/releases/tag/nightly>（匿名可下）。"
            echo "验证方式见包内 VERIFY.md。发布面: 本 artifact + 滚动 nightly Release（固定 tag nightly，非版本发布）。"
          } >> "$GITHUB_STEP_SUMMARY"
