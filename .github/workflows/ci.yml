name: ci

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # A stuck job (e.g. a sanitizer test hanging on a runner) must fail
    # the run in minutes, not occupy the box for GitHub's 6-hour default.
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      # Linux builds against system packages (apt) instead of vcpkg:
      # the vcpkg SDL2 dependency chain (libxcrypt etc.) is slow and
      # brittle on runners, and system FFmpeg dev headers let us compile
      # the FFmpeg backend for real.
      - name: Install system packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libsdl2-dev libfmt-dev doctest-dev ffmpeg \
            libavformat-dev libavcodec-dev libavutil-dev \
            libswresample-dev libswscale-dev

      # Synthetic media for the FFmpeg backend tests (fast lavfi
      # synthesis: dual audio, audio-only, subtitle+attachment, subtitle
      # only). The script also prints KEY=VALUE lines for $GITHUB_ENV.
      - name: Generate test media
        if: runner.os == 'Linux'
        run: |
          bash scripts/generate_test_media.sh build-system/testmedia | tee env.txt
          cat env.txt >> "$GITHUB_ENV"

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew update && brew install ninja

      - name: Install FFmpeg dev packages (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg pkg-config

      - name: Install Ninja (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja -y

      # Windows: force the MSVC environment so CMake does not pick the
      # MinGW gcc from PATH while vcpkg's x64-windows triplet builds
      # dependencies with MSVC (mixed toolchains fail to link).
      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Clone vcpkg
        if: runner.os != 'Linux'
        shell: bash
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git vcpkg

      - name: Bootstrap vcpkg (Unix)
        if: runner.os == 'macOS'
        shell: bash
        run: ./vcpkg/bootstrap-vcpkg.sh -disableMetrics

      - name: Bootstrap vcpkg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\vcpkg\bootstrap-vcpkg.bat -disableMetrics

      - name: Configure
        if: runner.os != 'Linux'
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
        run: cmake --preset default

      - name: Configure (Linux system packages)
        if: runner.os == 'Linux'
        run: cmake --preset linux-system

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: cmake --build --preset linux-system

      - name: Build (macOS/Windows)
        if: runner.os != 'Linux'
        run: cmake --build --preset default

      - name: Test (Linux)
        if: runner.os == 'Linux'
        # --output-on-failure prints whatever the killed test produced even
        # on a CTest timeout: a hung suite used to leave zero trace (the
        # tsan timeouts in runs 36068584525 and 36078113614), because the
        # captured doctest output — including the last test case started —
        # is otherwise discarded.
        run: ctest --preset linux-system --output-on-failure

      - name: Test (macOS/Windows)
        if: runner.os != 'Linux'
        run: ctest --preset default --output-on-failure

  tsan:
    # ThreadSanitizer job: exercises the FFmpeg backend concurrency tests
    # (decode_mutex_ discipline around format_ctx_/decode threads) with a
    # real media file. Any detected data race fails the run.
    name: tsan (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libsdl2-dev libfmt-dev doctest-dev ffmpeg \
            libavformat-dev libavcodec-dev libavutil-dev \
            libswresample-dev libswscale-dev

      - name: Generate test media
        run: |
          bash scripts/generate_test_media.sh build-system/testmedia | tee env.txt
          cat env.txt >> "$GITHUB_ENV"

      - name: Configure
        run: |
          cmake --preset linux-system \
            -DCMAKE_CXX_FLAGS="-fsanitize=thread -g" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread"

      - name: Build
        run: cmake --build --preset linux-system

      - name: Test
        env:
          TSAN_OPTIONS: halt_on_error=1 second_deadlock_stack=1
          # SDL on the runner connects to PulseAudio, and libpulse's
          # internal locks are not TSan-instrumented, so its own races get
          # attributed to whatever thread touches SDL audio (run
          # 35852616817: pa_mutex_lock vs pa_xmalloc). The dummy driver
          # keeps every SDLAudio code path exercised without libpulse.
          SDL_AUDIODRIVER: dummy
        run: ctest --preset linux-system --output-on-failure

  no-imgui:
    # The player UI overlay is an optional capability: the CMake probe
    # (CMakeLists.txt) degrades to the bare SDL video window when ImGui is
    # disabled or cannot be fetched. This job builds exactly that
    # configuration and drives its window on Xvfb, so the #else branch of
    # runPlayerWindow (and the "no ImGui" build of the whole app) stays
    # exercised instead of rotting behind an untested configuration.
    name: no-imgui fallback (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libsdl2-dev libfmt-dev doctest-dev ffmpeg \
            libavformat-dev libavcodec-dev libavutil-dev \
            libswresample-dev libswscale-dev \
            xvfb python3-xlib

      - name: Generate test media
        run: |
          bash scripts/generate_test_media.sh build-system/testmedia | tee env.txt
          cat env.txt >> "$GITHUB_ENV"

      - name: Configure without the ImGui overlay
        run: cmake --preset linux-system -DSOAR_ENABLE_IMGUI=OFF

      - name: Build
        run: cmake --build --preset linux-system

      - name: Test
        env:
          SDL_AUDIODRIVER: dummy
          SOAR_TEST_X11: "1"
        run: ctest --preset linux-system --output-on-failure

  asan:
    # AddressSanitizer + UBSan job: pins down memory errors (e.g. the
    # intermittent SIGSEGV in the open/close storm, runs 35851111131 and
    # 35853996679) that the TSan data-race view cannot localize. Leak
    # detection stays off to avoid third-party (FFmpeg/SDL) noise.
    name: asan (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libsdl2-dev libfmt-dev doctest-dev ffmpeg \
            libavformat-dev libavcodec-dev libavutil-dev \
            libswresample-dev libswscale-dev

      - name: Generate test media
        run: |
          bash scripts/generate_test_media.sh build-system/testmedia | tee env.txt
          cat env.txt >> "$GITHUB_ENV"

      - name: Configure
        run: |
          cmake --preset linux-system \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build
        run: cmake --build --preset linux-system

      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=0:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1
          SDL_AUDIODRIVER: dummy
        run: ctest --preset linux-system --output-on-failure

  coverage:
    # Line-coverage job: builds with GCC --coverage and reports src/ +
    # include/ coverage via gcovr, gated by fail-under thresholds so a
    # coverage regression fails the run instead of slipping in silently.
    # The FFmpeg backend only compiles where the libav* dev headers exist,
    # so this Linux job is the one place its coverage numbers are visible.
    name: coverage (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build gcovr libsdl2-dev libfmt-dev doctest-dev ffmpeg \
            libavformat-dev libavcodec-dev libavutil-dev \
            libswresample-dev libswscale-dev \
            xvfb python3-xlib

      - name: Generate test media
        run: |
          bash scripts/generate_test_media.sh build-system/testmedia | tee env.txt
          cat env.txt >> "$GITHUB_ENV"

      - name: Configure
        run: |
          cmake --preset linux-system \
            -DCMAKE_CXX_FLAGS="--coverage -O0 -g" \
            -DCMAKE_EXE_LINKER_FLAGS="--coverage"

      - name: Build
        run: cmake --build --preset linux-system

      - name: Test
        env:
          SDL_AUDIODRIVER: dummy
          # Opts the CLI test suite into window automation: with Xvfb and
          # python3-xlib installed above, the windowed run on a real X
          # server (render loop, texture updates, clean Escape exit) is
          # exercised and lands in this job's coverage. Sanitizer jobs
          # deliberately leave this off — libGL/libpulse are not
          # instrumented and only add noise there.
          SOAR_TEST_X11: "1"
        # -V so passing tests still print: the X11 window test logs the
        # CLI's event stream, which is the coverage analysis data for the
        # render loop.
        run: ctest --preset linux-system -V

      - name: Coverage report
        run: |
          # The decode threads make gcov's branch counters go negative
          # (GCC bug 68080), which gcovr refuses to parse. Ignore those
          # branch lines; the line data itself is intact.
          # The fail-under gates lock in the reached levels (line 91.5%,
          # branch 77.1% after the desktop-UI batch, whose own files are the
          # best-covered in the tree — see docs/coverage-notes.md §2.1 for
          # why the previous 93.5/82.0 pair was re-set rather than kept:
          # the P3a cache batch had already pushed the totals below it)
          # with slack for the ±1-2 line gcov counter jitter and for
          # timing-dependent arcs that flip under the window test's
          # concurrent decode load, so a regression fails here instead of
          # slipping in silently.
          # Two text reports because gcovr's txt output shows one metric
          # at a time: the branch table carries the gate, the line table
          # lands in the artifact for gap analysis. A 100%-line file can
          # still take only one side of its conditions, which is exactly
          # what the line numbers alone would hide.
          gcovr --root . --filter src --filter include \
            --txt coverage.txt --txt-metric branch \
            --exclude-throw-branches \
            --gcov-ignore-parse-errors negative_hits.warn_once_per_file \
            --fail-under-line 90.8 --fail-under-branch 76.0 \
            --print-summary > gcovr-summary.txt
          cat gcovr-summary.txt
          gcovr --root . --filter src --filter include \
            --txt coverage-lines.txt --txt-metric line \
            --gcov-ignore-parse-errors negative_hits.warn_once_per_file
          cat gcovr-summary.txt coverage.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.txt
            coverage-lines.txt

