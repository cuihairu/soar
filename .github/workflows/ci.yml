name: ci

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # A stuck job (e.g. a sanitizer test hanging on a runner) must fail
    # the run in minutes, not occupy the box for GitHub's 6-hour default.
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      # Linux builds against system packages (apt) instead of vcpkg:
      # the vcpkg SDL2 dependency chain (libxcrypt etc.) is slow and
      # brittle on runners, and system FFmpeg dev headers let us compile
      # the FFmpeg backend for real.
      - name: Install system packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libsdl2-dev libfmt-dev doctest-dev libboost-dev ffmpeg \
            libavformat-dev libavcodec-dev libavutil-dev \
            libswresample-dev libswscale-dev libass-dev

      # Synthetic media for the FFmpeg backend tests (fast lavfi
      # synthesis: dual audio, audio-only, subtitle+attachment, subtitle
      # only). The script also prints KEY=VALUE lines for $GITHUB_ENV.
      - name: Generate test media
        if: runner.os == 'Linux'
        run: |
          bash scripts/generate_test_media.sh build-system/testmedia | tee env.txt
          cat env.txt >> "$GITHUB_ENV"

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew update && brew install ninja

      - name: Install FFmpeg dev packages (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg pkg-config

      - name: Install Ninja (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja -y

      # Windows: force the MSVC environment so CMake does not pick the
      # MinGW gcc from PATH while vcpkg's x64-windows triplet builds
      # dependencies with MSVC (mixed toolchains fail to link).
      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Clone vcpkg
        if: runner.os != 'Linux'
        shell: bash
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git vcpkg

      - name: Bootstrap vcpkg (Unix)
        if: runner.os == 'macOS'
        shell: bash
        run: ./vcpkg/bootstrap-vcpkg.sh -disableMetrics

      - name: Bootstrap vcpkg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\vcpkg\bootstrap-vcpkg.bat -disableMetrics

      - name: Configure
        if: runner.os != 'Linux'
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
        run: cmake --preset default

      - name: Configure (Linux system packages)
        if: runner.os == 'Linux'
        run: cmake --preset linux-system

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: cmake --build --preset linux-system

      - name: Build (macOS/Windows)
        if: runner.os != 'Linux'
        run: cmake --build --preset default

      - name: Test (Linux)
        if: runner.os == 'Linux'
        # --output-on-failure prints whatever the killed test produced even
        # on a CTest timeout: a hung suite used to leave zero trace (the
        # tsan timeouts in runs 36068584525 and 36078113614), because the
        # captured doctest output — including the last test case started —
        # is otherwise discarded.
        env:
          SDL_AUDIODRIVER: dummy
        run: ctest --preset linux-system --output-on-failure

      - name: Test (macOS/Windows)
        if: runner.os != 'Linux'
        # -V streams the test process's output live instead of buffering it
        # until the suite exits: a hung test killed at the ctest timeout
        # leaves the doctest progress and the fixture stderr breadcrumbs in
        # the log, instead of zero trace.
        run: ctest --preset default -V --output-on-failure

      # 防回归（2026-10 夜间包缺 DLL 报障）：把 exe 连同 dumpbin 依赖
      # 闭包 staged 到干净目录，再以只剩 System32 的 PATH 实跑
      # --version。runner 自带的 VC 可运行库会把漏捆掩盖掉（缺的
      # DLL 系统里有），收窄 PATH 之后缺一个就红——打包脚本与每日
      # 构建共用 scripts/stage-windows-dlls.sh，这里每个 push 都验。
      - name: Stage package closure (Windows)
        if: runner.os == 'Windows'
        shell: bash
        # Debug 构建：debug bin 优先（同名 DLL 的 debug/release 变体
        # 不能混，vcpkg 两种都在各自的 bin 目录里）。
        run: |
          set -e
          bash scripts/stage-windows-dlls.sh build/soar.exe stage-verify \
            build/vcpkg_installed/x64-windows/debug/bin \
            build/vcpkg_installed/x64-windows/bin

      - name: Smoke packaged exe from a clean dir (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PATH = "$env:SystemRoot\System32"
          $out = (& .\stage-verify\soar.exe --version 2>&1 | Out-String)
          $code = $LASTEXITCODE
          Write-Host "exit code: $code"
          Write-Host "output: $out"
          if ($code -ne 0 -or $out -notmatch 'soar' -or $out -match '(?i)\.dll') {
            Write-Host "::error::packaged soar.exe failed from a clean dir (missing DLL or bad exit)"
            exit 1
          }

  tsan:
    # ThreadSanitizer job: exercises the FFmpeg backend concurrency tests
    # (decode_mutex_ discipline around format_ctx_/decode threads) with a
    # real media file. Any detected data race fails the run.
    name: tsan (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libsdl2-dev libfmt-dev doctest-dev libboost-dev ffmpeg \
            libavformat-dev libavcodec-dev libavutil-dev \
            libswresample-dev libswscale-dev libass-dev

      - name: Generate test media
        run: |
          bash scripts/generate_test_media.sh build-system/testmedia | tee env.txt
          cat env.txt >> "$GITHUB_ENV"

      - name: Configure
        run: |
          cmake --preset linux-system \
            -DCMAKE_CXX_FLAGS="-fsanitize=thread -g" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread"

      - name: Build
        run: cmake --build --preset linux-system

      - name: Test
        env:
          TSAN_OPTIONS: halt_on_error=1 second_deadlock_stack=1
          # SDL on the runner connects to PulseAudio, and libpulse's
          # internal locks are not TSan-instrumented, so its own races get
          # attributed to whatever thread touches SDL audio (run
          # 35852616817: pa_mutex_lock vs pa_xmalloc). The dummy driver
          # keeps every SDLAudio code path exercised without libpulse.
          SDL_AUDIODRIVER: dummy
        # -V streams doctest progress live: run 36740091819 hung this
        # suite past the ctest timeout in BOTH sanitizer jobs, and the
        # buffered doctest stdout was lost to the kill — only unbuffered
        # ffmpeg/libass stderr survived, which cannot name the test.
        run: ctest --preset linux-system -V --output-on-failure

  no-imgui:
    # The player UI overlay is an optional capability: the CMake probe
    # (CMakeLists.txt) degrades to the bare SDL video window when ImGui is
    # disabled or cannot be fetched. This job builds exactly that
    # configuration and drives its window on Xvfb, so the #else branch of
    # runPlayerWindow (and the "no ImGui" build of the whole app) stays
    # exercised instead of rotting behind an untested configuration.
    name: no-imgui fallback (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libsdl2-dev libfmt-dev doctest-dev libboost-dev ffmpeg \
            libavformat-dev libavcodec-dev libavutil-dev \
            libswresample-dev libswscale-dev libass-dev \
            xvfb python3-xlib

      - name: Generate test media
        run: |
          bash scripts/generate_test_media.sh build-system/testmedia | tee env.txt
          cat env.txt >> "$GITHUB_ENV"

      - name: Configure without the ImGui overlay
        run: cmake --preset linux-system -DSOAR_ENABLE_IMGUI=OFF

      - name: Build
        run: cmake --build --preset linux-system

      - name: Test
        env:
          SDL_AUDIODRIVER: dummy
          SOAR_TEST_X11: "1"
        run: ctest --preset linux-system --output-on-failure

  asan:
    # AddressSanitizer + UBSan job: pins down memory errors (e.g. the
    # intermittent SIGSEGV in the open/close storm, runs 35851111131 and
    # 35853996679) that the TSan data-race view cannot localize. Leak
    # detection stays off to avoid third-party (FFmpeg/SDL) noise.
    name: asan (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libsdl2-dev libfmt-dev doctest-dev libboost-dev ffmpeg \
            libavformat-dev libavcodec-dev libavutil-dev \
            libswresample-dev libswscale-dev libass-dev

      - name: Generate test media
        run: |
          bash scripts/generate_test_media.sh build-system/testmedia | tee env.txt
          cat env.txt >> "$GITHUB_ENV"

      - name: Configure
        run: |
          cmake --preset linux-system \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build
        run: cmake --build --preset linux-system

      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=0:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1
          SDL_AUDIODRIVER: dummy
        # -V for the same reason as the tsan job: run 36740091819's asan
        # media suite froze with only renderer-init stderr and no test
        # names, because the buffered stdout died with the process.
        run: ctest --preset linux-system -V --output-on-failure

  coverage:
    # Line-coverage job: builds with GCC --coverage and reports src/ +
    # include/ coverage via gcovr, gated by fail-under thresholds so a
    # coverage regression fails the run instead of slipping in silently.
    # The FFmpeg backend only compiles where the libav* dev headers exist,
    # so this Linux job is the one place its coverage numbers are visible.
    name: coverage (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build gcovr libsdl2-dev libfmt-dev doctest-dev libboost-dev ffmpeg \
            libavformat-dev libavcodec-dev libavutil-dev \
            libswresample-dev libswscale-dev libass-dev \
            xvfb python3-xlib

      - name: Generate test media
        run: |
          bash scripts/generate_test_media.sh build-system/testmedia | tee env.txt
          cat env.txt >> "$GITHUB_ENV"

      - name: Configure
        run: |
          cmake --preset linux-system \
            -DCMAKE_CXX_FLAGS="--coverage -O0 -g" \
            -DCMAKE_EXE_LINKER_FLAGS="--coverage"

      - name: Build
        run: cmake --build --preset linux-system

      - name: Test
        env:
          SDL_AUDIODRIVER: dummy
          # Opts the CLI test suite into window automation: with Xvfb and
          # python3-xlib installed above, the windowed run on a real X
          # server (render loop, texture updates, clean Escape exit) is
          # exercised and lands in this job's coverage. Sanitizer jobs
          # deliberately leave this off — libGL/libpulse are not
          # instrumented and only add noise there.
          SOAR_TEST_X11: "1"
        # -V so passing tests still print: the X11 window test logs the
        # CLI's event stream, which is the coverage analysis data for the
        # render loop.
        run: ctest --preset linux-system -V

      - name: Coverage report
        run: |
          # The decode threads make gcov's branch counters go negative
          # (GCC bug 68080), which gcovr refuses to parse. Ignore those
          # branch lines; the line data itself is intact.
          # The fail-under gates lock in the levels set by the gate-raise
          # evaluation that followed the coverage-boost batch (three
          # declared ffmpeg arms; docs/coverage-notes.md §3.16): this
          # job's coverage-report artifact on the same source reads 95.43%
          # line (4965/5203) and 85.55% branch (4921/5752; the previous
          # run of identical src read 4927/5752 — same-code branch
          # counters wobble ~6 between runs), and the local cov3 full run
          # under the system gcovr 7.2 (PATH=/usr/bin:$PATH; CI apt ships
          # 7.0, same 7.x family) reads 95.50% line (4966/5200) / 84.99%
          # branch (4995/5877). Slack over these gates: CI ~22 lines /
          # ~54 branches, local ~26 lines / ~23 branches — far above the
          # measured jitter band (2 lines / 4 branches), and the line
          # side still clears a recurrence of the one-off ~21-line
          # CI-vs-local gap seen in batch 1c, which is exactly why the
          # candidate one step higher (line 95.1, CI slack ~16 lines) was
          # rejected. A red gate here is read as "add coverage, not lower
          # the gate". Thresholds sit below min(local, CI) with slack
          # larger than the jitter band; reproduce locally with the
          # system gcovr — a hermes-PATH gcovr 8.6 aggregates headers
          # differently (~+5 line / ~-3 branch denominators on the same
          # gcda) and yields a misleading reading. This pair is the only
          # numeric gate in the workflows (no test-count threshold
          # exists). Levels behind earlier thresholds are chronicled in
          # docs/coverage-notes.md §2/§2.1 and §3.7-§3.16.
          # src/p2p is out of the gate for now: the P2P feature batch
          # (docs/mvp.md §5 P4) lands ahead of its tests by design; the
          # follow-up test batch brings it back under this gate (the
          # exclude goes away then).
          # Two text reports because gcovr's txt output shows one metric
          # at a time: the branch table carries the gate, the line table
          # lands in the artifact for gap analysis. A 100%-line file can
          # still take only one side of its conditions, which is exactly
          # what the line numbers alone would hide.
          gcovr --root . --filter src --filter include \
            --exclude '^src/p2p/' \
            --txt coverage.txt --txt-metric branch \
            --exclude-throw-branches \
            --gcov-ignore-parse-errors negative_hits.warn_once_per_file \
            --fail-under-line 95.0 --fail-under-branch 84.6 \
            --print-summary > gcovr-summary.txt
          cat gcovr-summary.txt
          gcovr --root . --filter src --filter include \
            --exclude '^src/p2p/' \
            --txt coverage-lines.txt --txt-metric line \
            --gcov-ignore-parse-errors negative_hits.warn_once_per_file
          cat gcovr-summary.txt coverage.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.txt
            coverage-lines.txt

