name: ci

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      # Linux builds against system packages (apt) instead of vcpkg:
      # the vcpkg SDL2 dependency chain (libxcrypt etc.) is slow and
      # brittle on runners, and system FFmpeg dev headers let us compile
      # the FFmpeg backend for real.
      - name: Install system packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libsdl2-dev libfmt-dev doctest-dev \
            libavformat-dev libavcodec-dev libavutil-dev \
            libswresample-dev libswscale-dev

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew update && brew install ninja

      - name: Install FFmpeg dev packages (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg pkg-config

      - name: Install Ninja (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja -y

      # Windows: force the MSVC environment so CMake does not pick the
      # MinGW gcc from PATH while vcpkg's x64-windows triplet builds
      # dependencies with MSVC (mixed toolchains fail to link).
      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Clone vcpkg
        if: runner.os != 'Linux'
        shell: bash
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git vcpkg

      - name: Bootstrap vcpkg (Unix)
        if: runner.os == 'macOS'
        shell: bash
        run: ./vcpkg/bootstrap-vcpkg.sh -disableMetrics

      - name: Bootstrap vcpkg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\vcpkg\bootstrap-vcpkg.bat -disableMetrics

      - name: Configure
        if: runner.os != 'Linux'
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
        run: cmake --preset default

      - name: Configure (Linux system packages)
        if: runner.os == 'Linux'
        run: cmake --preset linux-system

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: cmake --build --preset linux-system

      - name: Build (macOS/Windows)
        if: runner.os != 'Linux'
        run: cmake --build --preset default

      - name: Test (Linux)
        if: runner.os == 'Linux'
        run: ctest --preset linux-system

      - name: Test (macOS/Windows)
        if: runner.os != 'Linux'
        run: ctest --preset default

