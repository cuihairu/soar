<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="840" viewBox="0 0 1280 840" role="img" aria-labelledby="title desc" lang="en">
<title id="title">Soar playback process and network peers</title><desc id="desc">Solid lines carry media, control and results; dashed lines carry discovery, subscription and registration. One OS process hosts the UI, the playback core and the cast control point; receivers and media hosts sit outside it.</desc>
<defs>
 <marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#245bb2" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
 <marker id="teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#147565" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
 <style>text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI","Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#172b45}.sub{fill:#4c5d73}.blue{fill:#245bb2}.teal{fill:#147565}</style>
</defs><rect width="1280" height="840" fill="#fff"/>
<text x="28" y="40" font-size="27" font-weight="600" text-anchor="start">Playback process and network peers</text>
<text x="28" y="75" font-size="17" font-weight="400" text-anchor="start" class="sub">One OS process (soar / soarw.exe) over a platform-independent playback core; casting is a DLNA control point the receiver pulls from.</text>
<rect x="28" y="100" width="1224" height="470" rx="10" fill="#f4f9f8" stroke="#ced8e5" stroke-width="1.3"/>
<text x="48" y="128" font-size="17" font-weight="600" text-anchor="start" class="teal">The soar process</text>
