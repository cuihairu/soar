<rect x="52" y="152" width="276" height="84" rx="10" fill="#fff" stroke="#ced8e5" stroke-width="1.3"/>
<text x="70" y="182" font-size="22" font-weight="600" text-anchor="start">soarAppMain</text>
<text x="70" y="208" font-size="17" font-weight="400" text-anchor="start" class="sub">控制台 + Windows GUI 入口</text>
<text x="70" y="228" font-size="14" font-weight="500" text-anchor="start" class="sub">参数 · 后端选择</text>
</g>
